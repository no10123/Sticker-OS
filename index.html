<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="control">
        <h1 class="title centered">Sticker OS</h1>
        <img class="sticker hc" src="hc-link.png"  onclick="window.open('https://hackclub.com/', '_blank');"></img>
        <img class="sticker github" src="github.png"  onclick="window.open('https://github.com/no10123', '_blank');"></img>
        <img class="sticker calculator" src="calculator.png" onclick="AMI.openApp('calculator')">
        <img class="sticker notes" src="sticky-tape.png" onclick="AMI.openApp('notes')">
        <img class="sticker maze" src="maze.png" onclick="AMI.openApp('maze')">
    </div>
    <div id="viewport"></div>
    <div id="templates">
        <template id="t-calculator" class="dragable hidden">
            <div id="calc-display" class="calc-display-area">0</div>
            
            <div id="calculator-buttons" class="calc-grid calc-button-grid">
                <button type="button" class="Calc-btn" data-value="AC">AC</button>
                <button type="button" class="Calc-btn" data-value="%">%</button>
                <button type="button" class="Calc-btn" data-value="/">/</button>
                <button type="button" class="Calc-btn" data-value="*">*</button>
                
                <button type="button" class="Calc-btn" data-value="7">7</button>
                <button type="button" class="Calc-btn" data-value="8">8</button>
                <button type="button" class="Calc-btn" data-value="9">9</button>
                <button type="button" class="Calc-btn" data-value="-">-</button>
                
                <button type="button" class="Calc-btn" data-value="4">4</button>
                <button type="button" class="Calc-btn" data-value="5">5</button>
                <button type="button" class="Calc-btn" data-value="6">6</button>
                <button type="button" class="Calc-btn" data-value="+">+</button>
                
                <button type="button" class="Calc-btn" data-value="1">1</button>
                <button type="button" class="Calc-btn" data-value="2">2</button>
                <button type="button" class="Calc-btn" data-value="3">3</button>
                <button type="button" class="Calc-btn calc-btn-tall" data-value="=">=</button>
                
                <button type="button" class="Calc-btn calc-btn-wide" data-value="0">0</button>
                <button type="button" class="Calc-btn" data-value=".">.</button>
            </div>
        </template>
        <template id="t-notes" class="dragable hidden">
            <textarea class="notes-textarea" placeholder="notes..."></textarea>
        </template>
        <template id="t-maze" class="dragable hidden">
            <div class="container flex-col-window">
                <button type="button" class="Calc-btn gen" onclick="genMaze()">Generate Maze</button>
                <input  type="number" class="gen" id="maze-size" min="2" max="100" value="10">
                <canvas id="maze-canvas" width="250" height="250"></canvas>
            </div>
        </template>
    </div>
    <script src="script.js"></script>
</body>
</html>
